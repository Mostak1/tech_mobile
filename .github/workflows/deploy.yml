name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - simon

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The webpack chunk directory is intentionally gitignored. Build it in
      # CI so the manifest and main runtime never point at missing chunk files
      # on cPanel.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build production assets
        run: |
          npm ci
          npm run production

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.techseba.com
          username: idbpos@idbpos.techseba.com
          password: Mostak%12361236
          port: 21
          server-dir: idbpos.techseba.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/node_modules/**
            **/vendor/**
            **/.env
